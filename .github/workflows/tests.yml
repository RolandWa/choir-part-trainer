# Runs the tests on GitHub after every push and for every pull request.
# The result is shown as a green tick or a red cross next to the commit, and in the "Actions" tab.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Notation, syllables, lyrics (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: node tests/run.js --verbose
  browser:
    name: The app in a browser (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npm install --no-save --no-package-lock playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      # pdftoppm turns printed pages into pictures for the print checks (empty, cut-off or faint pages)
      - run: sudo apt-get install -y poppler-utils
      - run: node tests/browser/run.js
      # abcjs is not part of the repository; this step downloads it and checks the abcjs drawing.
      # It depends on the CDN, so a failure here is shown but does not turn the run red.
      - name: abcjs drawing (optional, downloads abcjs)
        continue-on-error: true
        run: |
          python3 tools/fetch_abcjs.py
          node tests/browser/run.js abcjs
