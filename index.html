<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free tool for choir singers: type your part in ABC notation, listen, loop, print and record yourself.">
<title>Choir Part Trainer</title>
<meta name="theme-color" content="#1f3b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Partia chóralna">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --page:#f3f5f1; --paper:#ffffff; --panel:#e9ede7; --ink:#1b1f1d; --muted:#646d67; --rule:#d5dbd4;
  --staff:#1b1f1d; --cloth:#1f3b33; --cloth-ink:#f3f5f1; --rubric:#b3261e; --rubric-soft:rgba(179,38,30,.09);
  --warn-bg:#f8e4e1; --warn-ink:#7d1b15; --ok:#2f7d4f; --mid:#b7791f; --bad:#b3261e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#111513; --paper:#181d1a; --panel:#212823; --ink:#e4eae5; --muted:#9aa59d; --rule:#2f3832;
    --staff:#e4eae5; --cloth:#8cc2ab; --cloth-ink:#0f1a15; --rubric:#ff7b6e; --rubric-soft:rgba(255,123,110,.12);
    --warn-bg:#3a1d1a; --warn-ink:#ffb4ab; --ok:#7fd19b; --mid:#f0b65a; --bad:#ff7b6e;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(86px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rubric);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:820px;margin:0 auto;padding:12px 12px 8px}
.serif{font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif}
.fatal{background:#b3261e;color:#fff;padding:10px 14px;margin:0}

/* header */
.top{display:flex;flex-direction:column;gap:8px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.appname{font-size:13px;color:var(--muted);margin:0}
.appname b{color:var(--cloth);font-weight:650}
select,input[type=number]{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;min-height:42px}
.langsel{min-height:34px;padding:4px 8px;font-size:13px;flex:none}
#songSel{width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-height:42px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.btn.small{min-height:36px;padding:5px 10px;font-size:13.5px}
.btn.on{background:var(--cloth);color:var(--cloth-ink);border-color:var(--cloth)}
.btn.primary{background:var(--cloth);color:var(--cloth-ink);border-color:var(--cloth)}
.btn.armed{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-ink)}
.status{font-size:12px;color:var(--muted);min-height:16px}

/* share */
.sharebox{background:var(--paper);border:1px solid var(--cloth);border-radius:8px;padding:10px 12px}
.sharehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sharebox .hint{margin-top:6px}
.shareurl{width:100%;margin-top:8px;font:12.5px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;word-break:break-all;resize:none;background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:8px}
.sharebox .row{margin:8px 0 0}

/* voices */
.voicebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.vlbl{font-weight:650;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-v{border:1px solid var(--rule);background:var(--paper);border-radius:18px;padding:6px 14px;font-weight:600;min-height:36px;cursor:pointer;touch-action:manipulation}
.chip-v[aria-checked="true"]{background:var(--cloth);color:var(--cloth-ink);border-color:var(--cloth)}

/* score page */
.page{background:var(--paper);border:1px solid var(--rule);border-radius:4px;margin:12px -4px 0;padding:12px 4px 6px}
.pagehead{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin:0 8px;min-height:18px}
.pvoice{font-weight:650;color:var(--ink)}
.pcomp{text-align:right;font-style:italic}
.songtitle{font-size:21px;line-height:1.2;font-weight:600;margin:2px 10px 2px;text-align:center}
.songmeta{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 6px}
.score{overflow-x:auto;-webkit-overflow-scrolling:touch}
.score svg{display:block}
.empty{color:var(--muted);padding:22px 12px;margin:0;text-align:center}

/* practice controls */
.controls{padding:14px 2px 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.row label{display:flex;align-items:center;gap:6px;font-size:14.5px}
.row input[type=number]{width:72px;text-align:center}
.tempo input[type=range]{flex:1;min-width:120px;accent-color:var(--cloth)}
.tempo .val{font-variant-numeric:tabular-nums;min-width:64px;font-weight:650}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tg{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;border:1px solid var(--rule);font-size:14px;cursor:pointer;user-select:none;background:var(--paper)}
.tg input{accent-color:var(--cloth);width:18px;height:18px;margin:0;flex:none}
.tg.inline{padding:6px 10px}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0;max-width:62ch}

/* sections */
details.sec{border-top:1px solid var(--rule);margin-top:16px;padding-top:10px}
details.sec>summary{cursor:pointer;font-weight:650;font-size:16px;padding:4px 2px;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 3px}
details.sec[open]>summary::before{transform:rotate(45deg)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.mixrow{display:grid;grid-template-columns:minmax(70px,120px) 1fr 44px;gap:8px;align-items:center;margin:8px 2px}
.mixrow input{accent-color:var(--cloth)}
.mixrow .pct{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}

/* warm-up */
.warmlist{list-style:none;padding:0;margin:10px 0 6px}
.warmlist li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--rule)}
.warmlist .wt{font-weight:650}
.warmlist .ws{font-size:13px;color:var(--muted)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}

/* tuner */
.tuner{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px;margin:10px 0}
.tdisp{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.tnote{font:600 46px/1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;min-width:96px}
.tinfo{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.tcents{font:700 24px/1.1 system-ui,sans-serif}
.thz{font-size:13px;color:var(--muted)}
.tstate{font-weight:650;font-size:15px;margin:6px 0 4px;min-height:22px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tstate .tt{color:var(--muted);font-weight:500}
.ok-t{color:var(--ok)} .mid-t{color:var(--mid)} .bad-t{color:var(--bad)}
.tgauge{width:100%;height:auto;display:block}
.tzone{fill:var(--ok);opacity:.2}
.ttick{stroke:var(--muted);stroke-width:1}
.tlab{fill:var(--muted);font:11px system-ui,sans-serif}
#tNeedle polygon{fill:var(--muted)} #tNeedle line{stroke:var(--muted);stroke-width:2.5}
#tNeedle.n-ok polygon{fill:var(--ok)} #tNeedle.n-ok line{stroke:var(--ok)}
#tNeedle.n-mid polygon{fill:var(--mid)} #tNeedle.n-mid line{stroke:var(--mid)}
#tNeedle.n-bad polygon{fill:var(--bad)} #tNeedle.n-bad line{stroke:var(--bad)}
#tNeedle.n-none{opacity:.25}
.ttrace{width:100%;height:140px;display:block;margin-top:8px;border-top:1px solid var(--rule)}
.tstats{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:8px 12px;font-weight:600;cursor:pointer;min-height:38px}
.seg button.on{background:var(--cloth);color:var(--cloth-ink)}
.refv{min-width:104px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
.tscore{background:var(--panel);border-radius:8px;padding:8px 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
body.tun-on{padding-bottom:calc(130px + env(safe-area-inset-bottom))}
.tpill{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:8px;z-index:7;display:inline-flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:18px;padding:6px 12px;font:650 14px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.15);cursor:pointer;font-variant-numeric:tabular-nums}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.pdot.ok{background:var(--ok)} .pdot.mid{background:var(--mid)} .pdot.bad{background:var(--bad)}
input.a4{width:76px;text-align:center}

/* abcjs notation */
.abcwrap{color:var(--staff)}
.abcwrap svg{display:block;width:100%;height:auto;overflow:visible}
.abcwrap svg path,.abcwrap svg text,.abcwrap svg tspan,.abcwrap svg rect:not(.hit):not(.rng){fill:var(--staff)}
.abcwrap svg [stroke]:not([stroke="none"]){stroke:var(--staff)}
.abcwrap svg .abcjs-lyric{fill:var(--ink)}
.abcwrap svg .abcjs-annotation{fill:var(--muted)}
.abcwrap rect.hit{fill:transparent;cursor:pointer}
.abcwrap rect.rng{fill:var(--rubric-soft)}
.abcwrap .ev.cur:not(.hit),.abcwrap .ev.cur path,.abcwrap .ev.cur text{fill:var(--rubric)}
.score.pitchmode .abcwrap .ev.cur:not(.hit),.score.pitchmode .abcwrap .ev.cur path,.score.pitchmode .abcwrap .ev.cur text{fill:var(--staff)}
.score.pitchmode .abcwrap rect.hit.cur{fill:var(--rubric-soft)}
.abcwrap .ev.pk-ok:not(.hit),.abcwrap .ev.pk-ok path,.abcwrap .ev.pk-ok text{fill:var(--ok)}
.abcwrap .ev.pk-warn:not(.hit),.abcwrap .ev.pk-warn path,.abcwrap .ev.pk-warn text{fill:var(--mid)}
.abcwrap .ev.pk-bad:not(.hit),.abcwrap .ev.pk-bad path,.abcwrap .ev.pk-bad text{fill:var(--bad)}

/* other tools, paste box */
.toollist{list-style:none;padding:0;margin:8px 0}
.toollist li{padding:10px 2px;border-bottom:1px solid var(--rule)}
.toollist a{color:var(--cloth);font-weight:650}
.toollist .td{display:block;font-size:13.5px;color:var(--muted);margin:2px 0 6px}
.pastebox{background:var(--paper);border:1px solid var(--cloth);border-radius:8px;padding:10px 12px}
.pastebox textarea{width:100%;font:14px ui-monospace,Menlo,Consolas,monospace;background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:9px;margin-top:8px;color:var(--ink);resize:vertical}

/* tune sources + picker sheet */
.srclist{list-style:none;padding:0;margin:8px 0}
.srclist li{padding:10px 2px;border-bottom:1px solid var(--rule)}
.srclist a{color:var(--cloth);font-weight:650}
.srclist .td{display:block;font-size:13.5px;color:var(--muted);margin:2px 0 0}
.srclist .sub{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:13.5px}
.srclist .sub a{font-weight:600}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-top:1px solid var(--rule);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.22);z-index:9;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
@media (min-width:760px){ .sheet{left:50%;right:auto;width:720px;transform:translateX(-50%)} }
.sheet ul{list-style:none;margin:8px 0 0;padding:0;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:11px 4px;font:inherit;color:var(--ink);cursor:pointer;min-height:44px}
.sheet li .sub{display:block;color:var(--muted);font-size:12.5px}
.sheet input{width:100%;font:15px system-ui,sans-serif;background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:9px;margin-top:8px;color:var(--ink)}
.sheet .more{font-size:12.5px;color:var(--muted);margin:6px 2px 0}

.instrow label{min-width:120px;font-size:14.5px}
.instrow select{flex:1;min-width:0}

.lyrnote{margin:6px 8px 4px;padding:8px 10px;border-radius:8px;background:var(--page);border:1px solid var(--rule);font-size:13.5px;color:var(--ink)}
.lyrnote p{margin:0 0 6px}
.lyrnote ul{margin:0 0 6px;padding-left:18px;color:var(--warn-ink)}
.lyrnote .btnrow{display:flex;flex-wrap:wrap;gap:6px}
html.pdfmode{--page:#fff;--paper:#fff;--ink:#000;--muted:#444;--rule:#ccc;--staff:#000;--rubric:#000;--rubric-soft:transparent;color-scheme:light}

/* notices + footer */
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border-left:4px solid var(--cloth);border-radius:6px;padding:10px 12px;margin:10px 0;font-size:14.5px;line-height:1.5}
.callout svg{flex:none;margin-top:1px;color:var(--cloth)}
.callout p{margin:0}
.callout b{font-weight:700}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);margin:26px 2px 8px;padding-top:12px;border-top:1px solid var(--rule)}
.foot a{color:var(--muted)}

/* recording */
.btn.rec .recdot{width:12px;height:12px;border-radius:50%;background:var(--rubric);display:inline-block;margin-right:8px;vertical-align:-1px}
.btn.rec.on{background:var(--rubric);color:#fff;border-color:var(--rubric)}
.btn.rec.on .recdot{background:#fff;border-radius:2px}
.meter{flex:1;min-width:90px;height:10px;border-radius:5px;background:var(--panel);overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--cloth)}
.takeinfo{font-size:14px;margin:12px 2px 6px;font-weight:600}
.row.slrow label{min-width:140px;font-size:14px}
.row.slrow input[type=range]{flex:1;min-width:120px;accent-color:var(--cloth)}
.row.slrow .v{min-width:62px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}

/* editor */
textarea{width:100%;margin-top:8px;font:16px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px;resize:vertical}
.warn{margin:8px 0 0;padding:8px 12px 8px 28px;background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;font-size:13.5px}
.warn li+li{margin-top:3px}
.pal{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.pal .lbl{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.pal-row{display:grid;gap:5px}
.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.c6{grid-template-columns:repeat(6,1fr)}.c7{grid-template-columns:repeat(7,1fr)}
.k{font-weight:650;font-size:15.5px;background:var(--paper);border:1px solid var(--rule);border-radius:7px;min-height:44px;padding:2px;cursor:pointer;touch-action:manipulation;line-height:1.15;overflow:hidden}
.k small{display:block;font-size:10px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k.on{background:var(--cloth);color:var(--cloth-ink);border-color:var(--cloth)}
.k.on small{color:inherit;opacity:.8}
.k.note{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:19px}

/* help */
.helpbody{font-size:14px;max-width:66ch}
.helpbody p{margin:8px 0}
.helpbody code,.helpbody pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--panel);border-radius:4px;padding:1px 4px}
.helpbody pre{padding:8px 10px;overflow-x:auto;line-height:1.5}
.helpbody table{border-collapse:collapse}
.helpbody td{padding:4px 12px 4px 0;border-bottom:1px solid var(--rule)}

/* transport */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:6px;z-index:5}
.ib{width:42px;height:42px;border-radius:8px;border:1px solid var(--rule);background:var(--page);font:650 20px/1 system-ui;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib.on{background:var(--cloth);color:var(--cloth-ink);border-color:var(--cloth)}
.chip{min-width:66px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.play{width:56px;height:56px;border-radius:50%;border:none;background:var(--cloth);color:var(--cloth-ink);cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;margin:0 4px}
.play.on{background:var(--rubric);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--page);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6;max-width:90vw;text-align:center}
.toast.show{opacity:.95}

/* notation */
.sl{stroke:var(--staff);stroke-width:1;opacity:.5}
.lg{stroke:var(--staff);stroke-width:1.1}
.hd{fill:var(--staff)}
.ho{fill:none;stroke:var(--staff);stroke-width:1.5}
.stm{stroke:var(--staff);stroke-width:1.2}
.flg{fill:none;stroke:var(--staff);stroke-width:1.6;stroke-linecap:round}
.bm{fill:var(--staff)}
.acc{fill:none;stroke:var(--staff);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.acc .acct{stroke-width:2.2;stroke-linecap:butt}
.dot{fill:var(--staff)}
.rst{fill:var(--staff)}
.rsl{fill:none;stroke:var(--staff);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.bar-l{stroke:var(--staff);stroke-width:1.2}
.bar-t{stroke:var(--staff);stroke-width:3.5}
.brk{stroke:var(--staff);stroke-width:3}
.clef{fill:none;stroke:var(--staff);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.clefd{fill:var(--staff)}
.clef8{fill:var(--staff);font:600 9px Georgia,serif}
.ts{fill:var(--staff);font:700 17px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.mno{fill:var(--muted);font:10px system-ui,sans-serif}
.vlab{fill:var(--muted);font:italic 10.5px "Iowan Old Style",Palatino,Georgia,serif}
.vol{fill:none;stroke:var(--muted);stroke-width:1}
.volt{fill:var(--muted);font:600 10.5px system-ui,sans-serif}
.tie{fill:none;stroke:var(--staff);stroke-width:1.3}
.lyr{fill:var(--ink);font:12.5px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.nm{fill:var(--muted);font:italic 11px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.tup{fill:var(--muted);font:italic 10.5px Georgia,serif}
.rng{fill:var(--rubric-soft)}
.hit{fill:transparent;cursor:pointer}
.ev.cur .hd,.ev.cur .dot,.ev.cur .rst{fill:var(--rubric)}
.ev.cur .ho,.ev.cur .stm,.ev.cur .flg,.ev.cur .rsl,.ev.cur .acc{stroke:var(--rubric)}
.ev.cur .lyr,.ev.cur .nm{fill:var(--rubric);font-weight:700}
.score.pitchmode .ev.cur .hd{fill:var(--staff)}
.score.pitchmode .ev.cur .ho,.score.pitchmode .ev.cur .stm{stroke:var(--staff)}
.score.pitchmode .ev.cur .hit{fill:var(--rubric-soft)}
.ev.pk-ok .hd,.ev.pk-ok .dot{fill:var(--ok)} .ev.pk-ok .ho,.ev.pk-ok .stm,.ev.pk-ok .flg{stroke:var(--ok)}
.ev.pk-warn .hd,.ev.pk-warn .dot{fill:var(--mid)} .ev.pk-warn .ho,.ev.pk-warn .stm,.ev.pk-warn .flg{stroke:var(--mid)}
.ev.pk-bad .hd,.ev.pk-bad .dot{fill:var(--bad)} .ev.pk-bad .ho,.ev.pk-bad .stm,.ev.pk-bad .flg{stroke:var(--bad)}

<script>
// ===== PURE START =====
const LETTERS='CDEFGAB';
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const FIFTHS_POS={F:-1,C:0,G:1,D:2,A:3,E:4,B:5};
const SHARP_ORDER='FCGDAEB', FLAT_ORDER='BEADGCF';
const KEY_OFF_SHARP=[8,5,9,6,3,7,4], KEY_OFF_FLAT=[4,7,3,6,2,5,1];
const EPS=1e-6;
const near=(a,b)=>Math.abs(a-b)<EPS;
const f1=v=>Math.round(v*10)/10;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function parseLenStr(s){
  const m=/^(\d+)?(?:(\/+)(\d+)?)?/.exec(s||'');
  if(!m||m[0]==='') return {mult:1,len:0};
  const num=m[1]?parseInt(m[1],10):1; let den=1;
  if(m[2]){ const sl=m[2].length; den=m[3]?parseInt(m[3],10)*Math.pow(2,sl-1):Math.pow(2,sl); }
  return {mult:den?num/den:1,len:m[0].length};
}
function parseFrac(s){ const m=/^\s*(\d+)\s*\/\s*(\d+)/.exec(s||''); return m&&+m[2]?(+m[1])/(+m[2]):null; }
function parseMeter(s){
  s=(s||'').trim();
  if(/^C\|/.test(s)) return {num:2,den:2,sym:'C|'};
  if(/^C/.test(s)) return {num:4,den:4,sym:'C'};
  const m=/^(\d+)\s*\/\s*(\d+)/.exec(s);
  if(m&&+m[2]) return {num:+m[1],den:+m[2],sym:null};
  if(/^none/i.test(s)) return null;
  return {num:4,den:4,sym:null,bad:true};
}
function parseTempo(s){
  s=(s||'').replace(/"[^"]*"/g,'');
  const m=/(\d+)\s*\/\s*(\d+)\s*=\s*(\d+(?:\.\d+)?)/.exec(s);
  if(m&&+m[2]) return {unit:(+m[1])/(+m[2]),bpm:+m[3]};
  const m2=/(\d+(?:\.\d+)?)/.exec(s);
  return m2?{unit:null,bpm:+m2[1]}:null;
}
function parseKey(str){
  let s=(str||'').trim(), clef=null;
  const cm=/\bclef\s*=\s*([^\s\]]+)/i.exec(s);
  if(cm) clef=cm[1];
  s=s.replace(/\b[a-z]+\s*=\s*[^\s\]]+/gi,'').trim();
  const toks=s.split(/\s+/).filter(Boolean);
  let k=toks[0]||'', mode='';
  if(/^(bass|treble|alto|tenor)/i.test(k)){ clef=clef||k; k=''; }
  for(const t of toks.slice(1)){
    if(/^(bass|treble|alto|tenor)/i.test(t)) clef=clef||t;
    else if(!mode&&/^(maj|min|m$|ion|aeo|dor|phr|lyd|mix|loc)/i.test(t)) mode=t;
  }
  if(!k||/^none$/i.test(k)) return {fifths:0,clef,ok:true};
  const m=/^([A-Ha-h])([#b]?)(.*)$/.exec(k);
  if(!m) return {fifths:0,clef,ok:false};
  let L=m[1].toUpperCase(); if(L==='H') L='B';
  const pos=FIFTHS_POS[L]+(m[2]==='#'?7:m[2]==='b'?-7:0);
  const md=(m[3]||mode).toLowerCase();
  let off=0, ok=true;
  if(md===''||md.startsWith('maj')||md.startsWith('ion')) off=0;
  else if(md==='m'||md.startsWith('min')||md.startsWith('aeo')) off=-3;
  else if(md.startsWith('mix')) off=-1;
  else if(md.startsWith('dor')) off=-2;
  else if(md.startsWith('phr')) off=-4;
  else if(md.startsWith('lyd')) off=1;
  else if(md.startsWith('loc')) off=-5;
  else ok=false;
  let fi=pos+off; if(fi>7||fi<-7){ ok=false; fi=Math.max(-7,Math.min(7,fi)); }
  return {fifths:fi,clef,ok};
}
function keyAccMap(fi){ const m={}; if(fi>0) for(let i=0;i<fi;i++) m[SHARP_ORDER[i]]=1; else for(let i=0;i<-fi;i++) m[FLAT_ORDER[i]]=-1; return m; }
function defaultUnit(meter){ return meter&&meter.num/meter.den<0.75?1/16:1/8; }
function beatUnit(meter){ if(!meter) return 0.25; if(meter.den===8&&meter.num%3===0&&meter.num>3) return 3/8; if(meter.sym==='C|') return 0.5; return 1/meter.den; }
function normClef(c){
  c=String(c||'').trim().toLowerCase();
  if(!c||c==='none'||c==='treble'||c==='g'||c==='g2') return {clef:'treble',ok:true};
  if(/^treble[-_]?8$/.test(c)||c==='tenor'||c==='g-8') return {clef:'treble-8',ok:true};
  if(c.startsWith('bass')||c==='f'||c==='f4') return {clef:'bass',ok:true};
  if(c.startsWith('treble')) return {clef:'treble',ok:true};
  return {clef:'treble',ok:false};
}
function clefInfo(clef){
  if(clef==='bass') return {type:'bass',bottom:18,shift:0};
  if(clef==='treble-8') return {type:'treble8',bottom:30,shift:0};
  return {type:'treble',bottom:30,shift:0};
}
function keySteps(ci,fi){
  const n=Math.min(7,Math.abs(fi)), adj=ci.type==='bass'?-2:0;
  return (fi>0?KEY_OFF_SHARP:KEY_OFF_FLAT).slice(0,n).map(o=>ci.bottom+o+adj);
}
function plName(letter,alter,naming){

function expandRepeats(M){
  const n=M.length, seq=[]; let i=0, repStart=0, second=false, guard=0; const used=new Set();

    if(second&&m.volta===1){
      let j=i; while(j<n&&!M[j].endRepeat) j++;

    }
    seq.push(i);
    if(m.endRepeat){
      if(!used.has(i)){ used.add(i); i=repStart; second=true; continue; }
      second=false; repStart=i+1;

}

function clickTimes(tl){

function durGlyph(d){
  const B=[1,0.5,0.25,0.125,0.0625,0.03125];
  for(const b of B){ if(near(d,b)) return {b,dots:0}; if(near(d,b*1.5)) return {b,dots:1}; if(near(d,b*1.75)) return {b,dots:2}; }

  if(d>1) return {b:1,dots:0};
  for(const b of B){ if(b<=d+EPS) return {b,dots:0}; }
  return {b:0.03125,dots:0};
}

function renderScore(R,o){

    if(ev.kind==='note'){
      if(ev.notes.some(n=>n.acc)) w+=9;

      if(names) lw=Math.max(lw,nameOf(ev,naming).length*6.2+7);

function lyrEsc(t){ return t.replace(/%/g,'').replace(/([_*|~\-])/g,'\\$1').replace(/\s+/g,'~'); }
function autoLyrics(R){

  const VS=R.voices.filter(v=>v.events.some(e=>e.kind==='note'));
  if(!VS.length||R.voices.some(v=>v.verses>0)) return null;
  const verses=lyrVerses(R.words); if(!verses.length) return null;
  const lang=lyrDetectLang(verses.map(v=>v.lines.join(' ')).join(' '));
  const lineLang=l=>{ if(lang==='la') return lang; const x=lyrDetectLang(l); return x==='la'&&(l.toLowerCase().match(/\p{L}+/gu)||[]).length>=2?'la':lang; };
  const syl=verses.map(vs=>vs.lines.map(l=>lyrSyllables(l,lineLang(l))));
  const byLine=new Map(), info={lang,verses:verses.map((vs,i)=>({label:vs.label,n:syl[i].reduce((a,b)=>a+b.length,0),voices:[]}))};
  for(const v of VS){
    const vi=R.voices.indexOf(v);
    // slots: notes and rests in written order, with melisma flags
    const slots=[]; let depth=0;
    for(const ev of v.events){
      if(ev.kind!=='note'&&ev.kind!=='rest') continue;
      const slurCont=ev.kind==='note'&&depth>0; depth+=ev.slurStart||0;
      slots.push({ev,note:ev.kind==='note',tie:!!ev.tieFromPrev,slur:slurCont,lg:ev.lg,k:slots.length});
      depth=Math.max(0,depth-(ev.slurEnd||0));

    const groups=[...new Set(slots.filter(s=>s.note).map(s=>s.lg))];
    const byMeas=new Map(); for(const s of slots){ const m=s.ev.measure; if(!byMeas.has(m)) byMeas.set(m,[]); byMeas.get(m).push(s); }
    const seq=expandRepeats(v.measures), seen={}, played=[];
    for(const mi of seq){ const p=seen[mi]=(seen[mi]||0); seen[mi]++; for(const s of (byMeas.get(mi)||[])) played.push({s,p}); }
    const hasRep=played.length!==slots.length;
    const written=slots.map(s=>({s,p:0}));
    const startA=x=>x.s.note&&!x.s.tie&&!x.s.slur, startB=x=>x.s.note&&!x.s.tie;
    const count=(list,f)=>list.reduce((a,x)=>a+(f(x)?1:0),0);
    const plan=verses.map((vs,vk)=>{
      const flat=[].concat(...syl[vk]), M=flat.length;
      const cands=[[written,startA,'A'],[written,startB,'B']];
      if(hasRep) cands.push([played,startA,'PA'],[played,startB,'PB']);
      let best=null;
      for(const [list,f,name] of cands){ const d=Math.abs(count(list,f)-M); if(!best||d<best.d) best={list,f,name,d,N:count(list,f)}; }
      // one text line per music line: align line by line so a miscount does not shift everything after it
      if(best.d&&syl[vk].length===groups.length&&groups.length>1){
        let err=0; const parts=[];
        groups.forEach((g,gi)=>{ const lst=written.filter(x=>x.s.lg===g), m=syl[vk][gi].length;
          const fa=Math.abs(count(lst,startA)-m), fb=Math.abs(count(lst,startB)-m), f=fb<fa?startB:startA; err+=Math.min(fa,fb); parts.push({lst,f,sy:syl[vk][gi]}); });

      }

          else if(any&&!pt.f(x)) tok.set(key,{kind:'hold'});

// The piece's text with the generated w: lines written in and the W: lines removed.
function abcWithAutoLyrics(R,text){
  if(!R||!R.autoLyr) return text;
  const out=[];
  R.lines.forEach((L,li)=>{
    if(L.kind!=='words') out.push(text.slice(L.start,L.end));
    const add=R.autoLyr.byLine.get(li); if(add) out.push(...add);
  });
  return out.join('\n');
}

// Builds the ABC text given to abcjs: only the shown voices, optional note names as "_name" annotations,
// and a map from each event to its character position in that text.
function abcDisplay(R,text,show,names,naming){
  const showSet=new Set(show.map(i=>R.voices[i].id));
  const hiding=R.voices.some(v=>v.measures.length&&!showSet.has(v.id));
  const byLine=new Map();
  R.voices.forEach((v,vi)=>{ for(const ev of v.events){ if(!byLine.has(ev.li)) byLine.set(ev.li,[]); byLine.get(ev.li).push({vi,ev}); } });
  let out='%%barnumbers 1\n'; const pos=new Map();
  R.lines.forEach((L,li)=>{
    let s=text.slice(L.start,L.end);
    if(L.kind==='blank') return;
    if(R.autoLyr&&L.kind==='words') return;
    if(hiding){ if(L.voice!=null&&!showSet.has(L.voice)) return; if(/^\s*%%\s*(score|staves)\b/.test(s)) return; }
    const fm=L.kind!=='music'&&/^(\s*(?:[A-Za-z]|\+):\s?)(.*)$/.exec(s);
    if(fm&&/^\s*[TCWwVNORAHZBDS+]:/.test(s)) s=fm[1]+decodeAbcText(stripComment(fm[2])).replace(/%/g,'\\%');
    const base=out.length;
    const evs=(byLine.get(li)||[]).filter(x=>showSet.has(R.voices[x.vi].id)).sort((a,b)=>a.ev.c0-b.ev.c0);
    const ins=[];
    if(names&&L.kind==='music') for(const x of evs){
      if(x.ev.kind!=='note'||x.ev.tieFromPrev) continue;
      const nm=nameOf(x.ev,naming).replace(/"/g,'');
      if(nm&&!ins.some(n=>n.rel===x.ev.c0-L.start)) ins.push({rel:x.ev.c0-L.start,str:'"_'+nm+'"'});
    }
    ins.sort((a,b)=>a.rel-b.rel);
    let line='', cur=0;
    for(const n of ins){ line+=s.slice(cur,n.rel)+n.str; cur=n.rel; }
    line+=s.slice(cur);
    for(const x of evs){ const rel=x.ev.c0-L.start; let sh=0; for(const n of ins) if(n.rel<=rel) sh+=n.str.length; pos.set(x.vi+':'+x.ev.i,base+rel+sh); }
    out+=line+'\n';
    const add=R.autoLyr&&R.autoLyr.byLine.get(li); if(add) out+=add.join('\n')+'\n';
  });
  return {text:out,pos};
}

// ===== PDF: the printed page drawn at 200 dpi, one JPEG per A4 page, no libraries needed =====
const PDF_PROPS=['fill','stroke','stroke-width','stroke-linecap','stroke-linejoin','stroke-dasharray','opacity','fill-opacity','stroke-opacity','font-family','font-size','font-weight','font-style','text-anchor','dominant-baseline','visibility','display'];
function svgSnapshot(svg){
  const cl=svg.cloneNode(true), src=[svg,...svg.querySelectorAll('*')], dst=[cl,...cl.querySelectorAll('*')];
  for(let k=0;k<src.length;k++){
    const cs=getComputedStyle(src[k]); let st='';
    for(const p of PDF_PROPS){ const v=cs.getPropertyValue(p); if(v) st+=p+':'+v+';'; }
    dst[k].setAttribute('style',st); dst[k].removeAttribute('class');
    if(src[k].classList&&(src[k].classList.contains('hit')||src[k].classList.contains('rng'))) dst[k].setAttribute('data-drop','1');
  }
  cl.querySelectorAll('[data-drop]').forEach(e=>e.remove());
  const vb=svg.viewBox&&svg.viewBox.baseVal, r=svg.getBoundingClientRect();
  const w=(vb&&vb.width)||parseFloat(svg.getAttribute('width'))||r.width, h=(vb&&vb.height)||parseFloat(svg.getAttribute('height'))||r.height;
  cl.setAttribute('width',w); cl.setAttribute('height',h); cl.setAttribute('xmlns',SVGNS);
  return {xml:new XMLSerializer().serializeToString(cl),w,h,title:!!svg.querySelector('.abcjs-title')};
}
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('img')); im.src=src; }); }
function canvasJpeg(cv){
  return new Promise(res=>{
    const fb=()=>{ const b=atob(cv.toDataURL('image/jpeg',0.9).split(',')[1]), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); res(u); };
    if(cv.toBlob) cv.toBlob(bl=>{ if(!bl) return fb(); bl.arrayBuffer().then(ab=>res(new Uint8Array(ab)),fb); },'image/jpeg',0.9); else fb();
  });
}
function pdfText(str){ let h='FEFF'; for(const ch of String(str)){ const c=ch.codePointAt(0); if(c>0xFFFF){ const v=c-0x10000; h+=(0xD800+(v>>10)).toString(16).padStart(4,'0')+(0xDC00+(v&1023)).toString(16).padStart(4,'0'); } else h+=c.toString(16).padStart(4,'0'); } return '<'+h.toUpperCase()+'>'; }
function buildPdf(pages,title){
  const enc=new TextEncoder(), chunks=[], offs=[]; let len=0;
  const push=x=>{ const b=typeof x==='string'?enc.encode(x):x; chunks.push(b); len+=b.length; };
  const obj=(n,body)=>{ offs[n]=len; push(n+' 0 obj\n'+body+'\nendobj\n'); };
  push('%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n');
  const N=pages.length, info=3+3*N, total=info+1;
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+pages.map((p,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+N+' >>');
  pages.forEach((p,i)=>{
    const pn=3+3*i, cn=pn+1, im=pn+2, cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(pn,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${cn} 0 R >>`);
    obj(cn,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[im]=len; push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`);
    push(p.jpg); push('\nendstream\nendobj\n');
  });
  obj(info,`<< /Title ${pdfText(title)} /Producer ${pdfText(t('appName')+' '+APP_VERSION)} >>`);
  const xref=len; let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++) x+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+total+' /Root 1 0 R /Info '+info+' 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(chunks,{type:'application/pdf'});
}
async function exportPdf(){
  if(!S.parsed||S.pdfBusy) return;
  S.pdfBusy=true; if(P.playing) stop();
  const root=document.documentElement, R=S.parsed; let snaps=[];
  const voiceTxt=$('pVoice').textContent, title=R.title||t('untitled'), comp=R.composer||'';
  try{
    toast(t('tPdfMaking'));
    S.printing=true; root.classList.add('pdfmode'); renderNow(true);
    SC.querySelectorAll('.pk-ok,.pk-warn,.pk-bad,.cur').forEach(e=>e.classList.remove('pk-ok','pk-warn','pk-bad','cur'));
    snaps=[...SC.querySelectorAll('svg')].map(svgSnapshot);
  } catch(e){ console.error(e); }
  finally{ root.classList.remove('pdfmode'); S.printing=false; renderNow(); }
  try{
    if(!snaps.length) throw new Error('nothing to draw');
    const DPI=200, mm=DPI/25.4, PW=Math.round(210*mm), PH=Math.round(297*mm), ML=15*mm, MT=14*mm, MB=16*mm, CW=PW-2*ML, pt=DPI/72;
    const sc=CW/Math.max(...snaps.map(x=>x.w)), imgs=[];
    for(const sn of snaps) imgs.push(await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sn.xml)));
    const hasTitle=snaps.some(x=>x.title), headH=hasTitle?14*pt:44*pt;
    // lay out systems on pages
    const pages=[[]]; let y=MT+headH;
    snaps.forEach((sn,i)=>{ const h=sn.h*sc; if(y+h>PH-MB&&pages[pages.length-1].length){ pages.push([]); y=MT; } pages[pages.length-1].push({i,y,h}); y+=h; });
    const out=[], cv=document.createElement('canvas'); cv.width=PW; cv.height=PH;
    const ctx=cv.getContext('2d'), serif='Georgia,"Times New Roman",serif', sans='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
    for(let pi=0;pi<pages.length;pi++){
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,PW,PH); ctx.fillStyle='#000'; ctx.textBaseline='alphabetic';
      if(pi===0){
        ctx.font=`${9*pt}px ${sans}`; ctx.textAlign='left'; if(voiceTxt) ctx.fillText(voiceTxt,ML,MT+8*pt);
        if(!hasTitle){
          ctx.textAlign='right'; if(comp) ctx.fillText(comp,PW-ML,MT+8*pt);
          ctx.textAlign='center'; ctx.font=`bold ${19*pt}px ${serif}`; ctx.fillText(title,PW/2,MT+32*pt,CW);
        }
      }
      for(const it of pages[pi]) ctx.drawImage(imgs[it.i],ML,it.y,snaps[it.i].w*sc,it.h);
      ctx.fillStyle='#555'; ctx.font=`${8*pt}px ${sans}`; ctx.textAlign='center';
      ctx.fillText(title+(voiceTxt?' – '+voiceTxt:'')+'   '+t('pdfPage',{n:pi+1,k:pages.length}),PW/2,PH-8*mm,CW);
      out.push({jpg:await canvasJpeg(cv),w:PW,h:PH});
    }
    download(buildPdf(out,title),fileName('.pdf'));
    toast(t('tPdfDone',{n:out.length}));
  } catch(e){ console.error('pdf',e); toast(t('tPdfFail')); }
  finally{ S.pdfBusy=false; }
}

// ===== MULTI-TUNE FILES (collections with many X: tunes) =====
function splitTunes(text){
  const lines=text.split(/\r?\n/), starts=[];
  lines.forEach((l,i)=>{ if(/^X:/.test(l)) starts.push(i); });
  if(starts.length<=1) return [{title:titleOf(text),abc:text}];
  // ABC 2.1, 2.2.2: the file header (first block, up to an empty line) must be copied into each extracted tune
  const pre=lines.slice(0,starts[0]); const blank=pre.findIndex(l=>l.trim()==='');
  // the text is already Unicode here, so the charset line is dropped (UTF-8 is the default)
  const head=(blank<0?pre:pre.slice(0,blank)).filter(l=>/^(%|[A-Za-z]:)/.test(l)&&!/^%abc/.test(l)&&!/^(%%|I:)\s*abc-charset/i.test(l));
  return starts.map((st,k)=>{
    const tl=lines.slice(st,k+1<starts.length?starts[k+1]:lines.length);
    let at=1; while(at<tl.length&&/^T:/.test(tl[at])) at++;   // X: first, then T:, then the copied file-header fields
    const body=tl.slice(0,at).concat(head,tl.slice(at)).join('\n').replace(/\s+$/,'')+'\n';
    const tm=/^T:\s*(.+)$/m.exec(body), cm=/^C:\s*(.+)$/m.exec(body);
    const clean=x=>decodeAbcText(stripComment(x)).trim();
    return {title:tm?clean(tm[1]):'X:'+(lines[st].slice(2).trim()||k+1),sub:cm?clean(cm[1]):'',abc:body};
  });
}
// ABC 2.1: text is UTF-8 unless "I:abc-charset" / "%%abc-charset" says iso-8859-1…10 or us-ascii.
// Files without a declaration that are not valid UTF-8 are old Windows/ISO files: pick the most plausible.
const COMMON_NONASCII=new Set('ąćęłńóśźżĄĆĘŁŃÓŚŹŻäöüßÄÖÜàâçèéêëîïôùûÿœæÀÂÇÈÉÊËÎÏÔÙÛŒÆáíúñÁÍÚÑ¿¡čďěňřšťůžČĎĚŇŘŠŤŮŽőűŐŰåøÅØ„”“’–«»'.split(''));
function plausibility(str){
  let sc=0, n=0;
  for(const ch of str){ const c=ch.charCodeAt(0); if(c<128) continue; if(++n>20000) break;
    if(c>=0x80&&c<=0x9f) sc-=6; else if(COMMON_NONASCII.has(ch)) sc+=2; else if(/\p{L}/u.test(ch)) sc+=0; else sc-=3; }
  return sc;
}
function decodeAbcBytes(buf){
  const u8=new Uint8Array(buf);
  const head=new TextDecoder('latin1').decode(u8.subarray(0,6000));
  const cs=/^(?:%%|I:)\s*abc-charset\s+([\w-]+)/im.exec(head);
  const fixDecl=t=>t.replace(/^((?:%%|I:)\s*abc-charset\s+)[\w-]+/im,'$1utf-8');
  if(cs&&!/^utf-?8$/i.test(cs[1])){ try{ return {text:fixDecl(new TextDecoder(cs[1].toLowerCase()).decode(u8)),enc:cs[1].toLowerCase()}; }catch(e){} }
  try{ return {text:new TextDecoder('utf-8',{fatal:true}).decode(u8),enc:'utf-8'}; }catch(e){}
  let best=null;
  for(const enc of ['windows-1250','iso-8859-2','windows-1252']){
    try{ const tx=new TextDecoder(enc).decode(u8), sc=plausibility(tx); if(!best||sc>best.sc) best={text:fixDecl(tx),raw:tx,enc,sc}; }catch(e){}
  }
  // identical result for Central and Western code pages (e.g. German umlauts): report it as Western
  if(best&&best.enc==='windows-1250'){ try{ if(new TextDecoder('windows-1252').decode(u8)===best.raw) best.enc='windows-1252'; }catch(e){} }
  return best||{text:new TextDecoder('latin1').decode(u8),enc:'iso-8859-1'};
}

    S.cur.mix[R.voices[j].id]=el.value/100; $('mixPct'+j).textContent=el.value+'%';
    applyLiveMix(); scheduleSave();
  });
  $('songSel').addEventListener('change',e=>openSong(e.target.value));
  $('shareBtn').addEventListener('click',openShare);
  $('instSel').addEventListener('change',e=>{ S.set.inst=e.target.value; saveSettings(); if(P.playing) stop(); preview([S.parsed&&S.parsed.voices[S.vi]&&S.parsed.voices[S.vi].clef==='bass'?48:60],0.9); });
  $('inst2Sel').addEventListener('change',e=>{ S.set.inst2=e.target.value; saveSettings(); if(P.playing) stop(); });
  $('pasteBtn').addEventListener('click',openPaste);
  $('pasteClose').addEventListener('click',()=>{ $('pasteBox').hidden=true; });
  $('pasteGo').addEventListener('click',pasteGo);
  $('pasteIn').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!/\n/.test($('pasteIn').value)&&/^https?:/.test($('pasteIn').value.trim())){ e.preventDefault(); pasteGo(); } });
  $('pickFilter').addEventListener('input',showPick);
  $('pickClose').addEventListener('click',()=>{ $('pickSheet').hidden=true; PICK=[]; });
  $('pickList').addEventListener('click',async e=>{ const b=e.target.closest('[data-pk]'); if(!b) return; const x=PICK[+b.dataset.pk]; $('pickSheet').hidden=true; PICK=[]; await addSong(x.abc,'tOpened'); });
  $('toolsSec').addEventListener('click',e=>{ const b=e.target.closest('[data-tool]'); if(b) openTool(b.dataset.tool); });
  $('tMic').addEventListener('click',tunStart);
  $('tPill').addEventListener('click',()=>{ $('tunerSec').open=true; $('tunerSec').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'}); });
  ['tModeN','tModeT'].forEach(id=>$(id).addEventListener('click',()=>{ S.set.tMode=$(id).dataset.tmode; saveSettings(); tunUI(); }));
  $('tRefDn').addEventListener('click',()=>tunSetRef(tunRef()-1));
  $('tRefUp').addEventListener('click',()=>tunSetRef(tunRef()+1));
  $('tRefPlay').addEventListener('click',tunPlayRef);
  $('tDrone').addEventListener('click',tunDroneToggle);
  $('tFollow').addEventListener('change',()=>{ S.set.tFollow=$('tFollow').checked; saveSettings(); tunUI(); });
  $('tTol').addEventListener('change',e=>{ S.set.tTol=+e.target.value; saveSettings(); tunUI(); });
  $('tA4').addEventListener('change',e=>{ const v=Math.round(+e.target.value); S.set.a4=(v>=415&&v<=466)?v:440; saveSettings(); tunUI(); });
  $('tClear').addEventListener('click',clearMarks);
  $('warmVoices').addEventListener('click',e=>{ const b=e.target.closest('[data-wv]'); if(!b) return; S.set.warmVoice=b.dataset.wv; saveSettings(); buildWarmUI(); });
  $('warmList').addEventListener('click',e=>{ const b=e.target.closest('[data-wu]'); if(b) openWarmup(b.dataset.wu,warmVoice()); });
  $('shareClose').addEventListener('click',()=>{ $('shareBox').hidden=true; });
  $('shareCopy').addEventListener('click',copyShare);
  $('shareNative').addEventListener('click',nativeShare);
  $('shareUrl').addEventListener('focus',e=>e.target.select());
  window.addEventListener('hashchange',()=>{ importFromHash(); });
  $('langSel').addEventListener('change',e=>{ LANG=e.target.value; S.set.lang=LANG; saveSettings(); applyLang(); });
  $('new1Btn').addEventListener('click',async()=>{ await addSong(tplSingle(),'tNewSong'); $('edDetails').open=true; });
  $('newSatbBtn').addEventListener('click',async()=>{ await addSong(tplSATB(),'tNewSong'); $('edDetails').open=true; });
  $('openBtn').addEventListener('click',()=>$('fileIn').click());
  $('fileIn').addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=async()=>{ const d=decodeAbcBytes(rd.result); e.target.value=''; await importAbcText(d.text,'tOpened'); if(d.enc!=='utf-8'&&d.enc!=='us-ascii') setTimeout(()=>toast(t('tEncoding',{e:d.enc.toUpperCase()})),2300); }; rd.readAsArrayBuffer(f);
  });
  $('saveBtn').addEventListener('click',()=>{ if(S.cur) download(new Blob([abcForExport(S.cur.abc)],{type:'text/vnd.abc;charset=utf-8'}),fileName('.abc')); });
  $('printBtn').addEventListener('click',()=>{ preparePrint(); setTimeout(()=>window.print(),80); });
  $('pdfBtn').addEventListener('click',exportPdf);
  $('lyrNote').addEventListener('click',e=>{ const b=e.target.closest('[data-lyr]'); if(b) lyrAction(b.dataset.lyr); });
  window.addEventListener('beforeprint',preparePrint);
  window.addEventListener('afterprint',endPrint);
  window.addEventListener('focus',()=>{ if(S.printing) setTimeout(endPrint,300); });
  if(window.matchMedia){ const mq=window.matchMedia('print'); const h=e=>{ if(!e.matches) endPrint(); }; if(mq.addEventListener) mq.addEventListener('change',h); else if(mq.addListener) mq.addListener(h); }
  $('delBtn').addEventListener('click',delSong);
  let rT;
  const onRange=()=>{ if(!S.cur) return; const rv=rangeVals(); S.cur.from=rv.from; S.cur.to=rv.to; scheduleSave(); if(P.playing) stop(); clearTimeout(rT); rT=setTimeout(()=>renderNow(),200); };
  $('fromIn').addEventListener('input',onRange); $('toIn').addEventListener('input',onRange);
  $('allBtn').addEventListener('click',()=>{ $('fromIn').value=''; $('toIn').value=''; onRange(); });
  $('tempoR').addEventListener('input',e=>setBpm(+e.target.value));
  $('tempoReset').addEventListener('click',()=>{ if(S.cur){ S.cur.bpm=null; updateTempoUI(); scheduleSave(); } });
  $('slower').addEventListener('click',()=>setBpm(curBpm()-5));
  $('faster').addEventListener('click',()=>setBpm(curBpm()+5));
  [['tMetro','metro'],['tCount','count'],['tOct','oct'],['tNames','names'],['tAbcjs','abcjs']].forEach(([id,k])=>{
    $(id).addEventListener('change',()=>{ S.set[k]=$(id).checked; saveSettings(); if(k==='names'||k==='abcjs') renderNow(); });
  });
  $('loopBtn').addEventListener('click',()=>{ S.set.loop=!S.set.loop; applySettingsUI(); saveSettings(); toast(t(S.set.loop?'tLoopOn':'tLoopOff')); });
  $('playBtn').addEventListener('click',()=>{ if(P.playing) stop(); else play(); });
  $('refBtn').addEventListener('click',refTone);
  $('recBtn').addEventListener('click',recStart);
  $('tkPlayMix').addEventListener('click',()=>recPlay(true));
  $('tkPlayVoice').addEventListener('click',()=>recPlay(false));
  $('tkVol').addEventListener('input',e=>{ if(REC.take){ REC.take.vol=e.target.value/100; showTake(); } });
  $('tkOff').addEventListener('input',e=>{ if(REC.take){ REC.take.userMs=+e.target.value; showTake(); } });
  $('tkOff').addEventListener('change',()=>{ if(P.playing&&REC.take) recPlay(true); });
  $('tkDlVoice').addEventListener('click',recDlVoice);
  $('tkDlMix').addEventListener('click',recDlMix);
  $('tkDel').addEventListener('click',()=>{ stop(); REC.take=null; showTake(); });
  document.addEventListener('keydown',e=>{
    const tg=document.activeElement&&document.activeElement.tagName;
    if(e.code==='Space'&&!['TEXTAREA','INPUT','SELECT','BUTTON'].includes(tg)){ e.preventDefault(); if(P.playing) stop(); else play(); }
  });
  let rz; window.addEventListener('resize',()=>{ if(S.printing) return; clearTimeout(rz); rz=setTimeout(()=>renderNow(),150); });
}
async function init(){
  if(!I18N) document.body.insertAdjacentHTML('afterbegin','<p class="fatal">i18n.js is missing – keep it in the same folder as index.html.</p>');
  const set=await Store.get('choir:settings'); if(set) Object.assign(S.set,set);
  LANG=pickLang(); fillLangSel(); wire(); applyLang(); applySettingsUI();
  const idx=await Store.get('choir:index'); S.songs=Array.isArray(idx)?idx.filter(x=>x&&x.id):[];
  const imported=await importFromHash();
  if(imported){ setStatus(Store.ok?'autosave':'noStorage'); return; }
  if(!S.songs.length){
    const s=newSongObj(makeDemo());
    S.cache[s.id]=s; S.songs=[{id:s.id,title:titleOf(s.abc)}];
    await Store.set('choir:song:'+s.id,s); await saveIndex();
  }
  await openSong(S.songs.some(x=>x.id===S.set.lastId)?S.set.lastId:S.songs[0].id);
  setStatus(Store.ok?'autosave':'noStorage');
}
init().then(()=>loadAbcjs());
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
